name: Bug report
description: Report reproducible incorrect behavior
title: ""
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - iOS app
        - Pi extension
        - Pairing or authentication
        - Tunnel or networking
        - WebSocket protocol
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include the app commit, Pi version, iOS version, and macOS version.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Remove tokens, pairing codes, prompts, and sensitive tool output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: text
