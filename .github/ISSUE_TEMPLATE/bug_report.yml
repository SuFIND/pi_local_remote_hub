name: Bug report
description: Report reproducible incorrect behavior
title: ""
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Pi Remote Hub
        - Pi Hub menu bar app
        - Pi extension
        - Pairing or authentication
        - Networking or Bonjour
        - WebSocket protocol
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include the hub version or commit, Pi version, Node version, macOS version, and the iOS app version.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Remove tokens, pairing codes, prompts, and sensitive tool output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: text
