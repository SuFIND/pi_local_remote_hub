name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: Extension
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev
      - run: npm pack --dry-run --ignore-scripts

  pihub:
    name: Pi Hub (macOS)
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - name: Test PiHubCore
        run: swift test --package-path mac/PiHub
